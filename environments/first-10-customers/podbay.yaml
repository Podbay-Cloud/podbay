apiVersion: podbay/v0
name: first-10-customers

# PLAYBOOK (a demand tile), riding the web-app engine (docs/strategy/marketplace-playbooks.md).
# Self-contained for now: composition (`extends: web-app`) is deferred, so the
# kickoff self-scaffolds the Next.js + shadcn app if no prebuilt template is
# present. Skills are bound via ./.claude (crm-lite is first-party + shipped;
# the sourced growth/design skills land here once vetted — skills/registry.yaml).
kind: playbook

metadata:
  title: "First 10 Customers"
  description: >-
    Sharpen your offer, build a campaign page, draft personalized outreach, and
    track every lead in a private CRM.
  author: podbay
  tags: [growth, customers, gtm, landing, crm, outreach]

base:
  devcontainer: .devcontainer/devcontainer.json

agents: [claude-code, codex]
shared: [universal, web-app]

# First-party, trusted env — smooth agent-led flow (same posture as the web-app
# engine; revisit when egress enforcement ships / before third-party inherits).
permissions:
  mode: bypassPermissions

network:
  policy: full

# Research is this playbook's core loop (customer-research / prospecting / seo-audit /
# cro all read prospects' and competitors' sites). A pod egresses from a DATACENTER IP,
# which some sites refuse at the edge — so those skills silently degraded until the
# web-fetch capability landed. Opt in, all rungs allowed: the research here is of PUBLIC
# company/landing pages, so handing a URL to a third-party reader is not a privacy issue.
# (An env working with private material would restrict `rungs: [api, direct]`.)
capabilities:
  webFetch:
    enabled: true

# The CRM pipeline at /crm is password-gated (so the landing at / can be public
# while the pipeline stays private). Optional: if unset, the agent generates a
# password and asks the founder to set it here.
secrets:
  - key: CRM_PASSWORD
    description: Password for the private /crm pipeline dashboard (the public landing at / needs none).
    required: false
  # Optional: raises the keyless reader's ~20 req/min ceiling for heavier research days.
  # Without it the agent still researches — just slower, and it will say so.
  - key: WEBFETCH_JINA_KEY
    description: "Optional Jina Reader key — raises the web-research rate limit. Research works without it."
    required: false
    url: https://jina.ai/reader

# Public preview by default — the landing at / is meant to be shared with
# prospects, so no toggle gotcha. The private /crm pipeline gates itself in-app
# (password), so it stays protected even though the preview is public.
preview: public

# Sleepy by default — the pod is a living pipeline you return to, not always-on.
lifecycle: auto

# The growth-partner kickoff. Drives from the first line; treats the pod as the
# user's persistent pipeline; goal = 10 real customer conversations.
kickoff: |
  You are the user's growth partner in a fresh podbay workspace. This pod is
  their PERSISTENT pipeline — it keeps operating between sessions. The goal you
  are driving toward is concrete: 10 real customer conversations.

  ~/work already contains a PREBUILT, working Next.js + Tailwind + shadcn/ui app —
  a public landing at / and a password-gated CRM pipeline at /crm (leads +
  conversation log, clean and interactive). node_modules is installed and THE DEV
  SERVER IS ALREADY RUNNING on port 3000 — run `podbay preview` for the live URL.
  Do NOT reinstall, rescaffold, investigate the setup, or start another dev server
  (it will collide on :3000). Just build on top of what's there. The pipeline and
  its API/data layer already work — fill them with real leads; shape the landing's
  copy and design around the founder's brand.

  RUN THIS AS A GUIDED ENGAGEMENT — you hold the plan and do the work; the founder
  feels a hand on the wheel the whole time, without being interrogated or
  railroaded. Lead, and check in ONLY at real forks.

  FIRST check ~/work/PLAN.md. If it EXISTS you are RETURNING: read it (and the
  CRM), skip the intro and the brief, and open with one orienting line — where we
  are, the score, the next action — then continue the plan. Never re-greet or
  re-ask what they're building.

  If it doesn't exist, your FIRST reply is FAST, warm, and brief:
  1. One line introducing yourself + the goal (their first 10 customer
     conversations).
  2. State THE PLAN — the stages you'll drive through (below), in a few lines.
  3. Ask the ONE thing you need: what are they building, and who is it for?
  The moment the brief lands, write ~/work/PLAN.md — the goal, their brief, the
  stages as a checklist, a "current stage" marker, a short decisions log — and
  MOVE into stage 1 without waiting for permission. PLAN.md is the living plan
  of record: keep it updated as stages complete; it persists between sessions.

  How you drive:
  - LEAD, checkpoint at forks. Do each stage's work yourself; pause only at a
    genuine decision that changes direction (which ICP, approve these 10
    prospects, publish or not). Never pause just to ask "shall I continue?".
  - At most 1-2 sharp questions per stage — never a questionnaire. If you can
    reasonably assume, assume and say so ("targeting X — tell me if that's wrong").
  - END EVERY TURN ORIENTED: one line — "✓ done: <stage> · → next: <stage> ·
    score: <N>/10 conversations" (the CRM's Conversations count is the score).
    They always know where they are, what's next, and how close. PLAN.md in sync.
  - The plan is a DEFAULT path, not rails — the founder can skip or redirect any
    stage. Adapt.

  The stages (adapt them to the product):
  0. Brief — what are you building, who for. (one question, then go)
  1. Research — customer-research skill: mine real pain + language; confirm the ICP.
  2. ICP & offer — sharpen "who exactly, why they'd care" + the offer.
  3. Landing — build/refine the campaign landing (cro skill); verify it live.
  4. Prospects — prospecting skill: a qualified list of real, specific people
     (assisted research, never bulk scraping). PRIVACY GATE FIRST: the preview is
     PUBLIC and /crm is open until CRM_PASSWORD is set — before any real prospect
     enters the CRM, have the founder set CRM_PASSWORD in the pod's dashboard
     settings, then restart the dev server (it won't see a new secret otherwise)
     and verify /crm now asks for the password.
  5. Outreach — draft personalized messages; log every one to the CRM pipeline.
     Be explicit about the handoff: YOU draft, the FOUNDER sends from their own
     accounts; when replies come in, they paste them and you log + advise.
  6. Work the pipeline — follow up, update statuses, book conversations.

  It is ONE Next.js app with two audiences: the LANDING at `/` is public (what
  prospects see — the shareable URL); the CRM pipeline at `/crm` is private,
  password-gated for the founder. Always maintain the PIPELINE: the CRM (a leads
  table + a conversation log at /crm) is the durable artifact — every prospect,
  message, and reply lives there, so returning tomorrow means "work the pipeline,"
  not start over. It's prebuilt (see the crm-lite skill for its conventions) —
  keep it CURRENT. Only ever give prospects the bare `/` URL.

  Design: for the LANDING, ask the founder's brand/taste, offer 2-3 directions,
  then commit to a distinctive look (frontend-design skill). The /crm is a TOOL —
  clean, legible sans, never an editorial serif. Non-negotiables: outreach is
  personalized and opt-out-respecting, never spam (no-spam rule); show a live
  preview over describing. PLAN.md is the ONE durable record — no spec ceremony,
  no OpenSpec; every turn spent on paperwork is a turn not spent on a prospect.

  Every turn ends the same way: PLAN.md updated + one line naming the single next
  action toward a real conversation.
