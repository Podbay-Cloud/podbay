# Podbay skills registry — the audit ledger for approved agent skills.
# Model + flow: docs/plans/skills-management.md. Discovery is skills-first (survey skills.sh via
# `npx skills find` before authoring — see skills/survey/). Skills are vendored + pinned into the
# `.claude/skills` layer: environments/_shared/.claude/skills (global) or a specific env's
# .claude/skills. This file records provenance/audit; the vendored files are the pinned artifact.
#
# audit.status: passed = vetted + vendored + bound (bindable). pending = in the pipeline.
#   needs-mitigation = reviewed and shipping, but with a specific known gap recorded in
#   its notes (the fix is stated there). not-selected / superseded = kept for the record.
# Vendored files are NEVER edited (policy 2026-07-23) — problems are countered in
# pod-base/runtime-rules.md (universal) or the env kickoff, so upstream pins stay exact.
# tier: t0 first-party (podbay) · t1 official (Anthropic/Vercel) · t2 community · t3 user-supplied
# Transport/pin: vercel-labs/skills (`npx skills`) + skills.sh install leaderboard.

